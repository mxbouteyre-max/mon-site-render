services:
  - type: web
    name: script-runner
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 360 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Optionnel : protège l'accès avec un mot de passe
      # - key: RUNNER_SECRET
      #   value: ton-mot-de-passe-ici
